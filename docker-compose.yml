services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: study_mind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - study_mind_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_mind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  study_mind_postgres:
